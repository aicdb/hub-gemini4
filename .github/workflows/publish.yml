name: Publish hub

# Rebuilds the hub from every source repo listed in sources.json and deploys it to Pages.
#   - push to main (hub code changed)          -> always rebuild
#   - workflow_dispatch / repository_dispatch  -> always rebuild (repo builders: `gh workflow run publish.yml -R aicdb/hub-gemini4`)
#   - schedule (every 6 h)                     -> rebuild only if a source repo or the hub has a new commit
#
# The source repos are private: the secret HUB_SOURCES_TOKEN must hold a token with read access
# (Contents: read) to all of them. See README.md.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if nothing changed"
        type: boolean
        default: true
  repository_dispatch:
    types: [source-updated]
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.plan.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          # otherwise checkout's GITHUB_TOKEN auth header (hub repo only) overrides HUB_SOURCES_TOKEN for git calls
          persist-credentials: false

      - name: Resolve source commits
        id: plan
        env:
          TOKEN: ${{ secrets.HUB_SOURCES_TOKEN }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN}" ]; then
            echo "::error title=Missing secret::HUB_SOURCES_TOKEN is not set (needs read access to the private source repos, see README.md)"
            exit 1
          fi
          raw_len=${#TOKEN}
          TOKEN=$(printf %s "$TOKEN" | tr -d '[:space:]')
          echo "token: ${#TOKEN} chars (raw ${raw_len}), prefix ${TOKEN:0:11}…"
          : > sources.lock
          for row in $(jq -r '.components[] | "\(.id)|\(.repo)|\(.branch // "main")"' sources.json); do
            IFS='|' read -r id repo branch <<< "$row"
            sha=$(git ls-remote "https://x-access-token:${TOKEN}@github.com/${repo}.git" "refs/heads/${branch}" 2>/dev/null | cut -f1 || true)
            if [ -z "$sha" ]; then echo "::warning title=Source unreachable::${repo}@${branch} (check HUB_SOURCES_TOKEN has access)"; sha=missing; fi
            echo "${id} ${repo} ${branch} ${sha}" | tee -a sources.lock
          done
          if grep -q ' missing$' sources.lock; then
            echo "--- access diagnostics (GitHub API) ---"
            curl -s -o /tmp/u.json -w "GET /user -> HTTP %{http_code}\n" -H "Authorization: Bearer ${TOKEN}" https://api.github.com/user || true
            jq -r '"  login: \(.login // "-")  message: \(.message // "-")"' /tmp/u.json 2>/dev/null || true
            for repo in $(awk '$4=="missing"{print $2}' sources.lock); do
              code=$(curl -s -o /tmp/r.json -w "%{http_code}" -H "Authorization: Bearer ${TOKEN}" "https://api.github.com/repos/${repo}" || true)
              echo "GET /repos/${repo} -> HTTP ${code}: $(jq -r '.message // .full_name' /tmp/r.json 2>/dev/null)"
            done
          fi
          if ! grep -qv ' missing$' sources.lock; then
            echo "::error title=No source reachable::HUB_SOURCES_TOKEN cannot read any repo in sources.json; refusing to deploy an empty site"
            exit 1
          fi
          fp=$( (git rev-parse HEAD; cat sources.lock) | sha256sum | cut -c1-16)
          echo "fingerprint=${fp}" >> "$GITHUB_OUTPUT"
          live=$(curl -fsS "https://aicdb.github.io/hub-gemini4/data/build.json" 2>/dev/null | jq -r '.fingerprint // ""' || true)
          echo "live fingerprint: '${live}'  new: '${fp}'"
          if [ "${EVENT}" = "schedule" ] && [ "${live}" = "${fp}" ]; then
            echo "Nothing changed since the last deploy; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch docs/ of every source (sparse, shallow)
        if: steps.plan.outputs.skip != 'true'
        env:
          TOKEN: ${{ secrets.HUB_SOURCES_TOKEN }}
        run: |
          set -euo pipefail
          TOKEN=$(printf %s "$TOKEN" | tr -d '[:space:]')
          mkdir -p src
          while read -r id repo branch sha; do
            [ "$sha" = missing ] && continue
            name="${repo##*/}"
            dir=$(jq -r --arg id "$id" '.components[] | select(.id==$id) | .dir // "docs"' sources.json)
            git clone --quiet --depth 1 --filter=blob:none --sparse --branch "$branch" \
              "https://x-access-token:${TOKEN}@github.com/${repo}.git" "src/${name}"
            # docs/ (published data) + hub/ (the repo's exporter) + root files (points.json, …)
            extra=$(jq -r --arg id "$id" '.components[] | select(.id==$id) | (.sparse // []) | join(" ")' sources.json)
            git -C "src/${name}" sparse-checkout set "$dir" hub $extra
            # never leave the credential in the clone: repo exporters run in the build step
            git -C "src/${name}" remote set-url origin "https://github.com/${repo}.git"
            echo "${id}: $(git -C "src/${name}" rev-parse --short HEAD), $(du -sh "src/${name}/${dir}" | cut -f1)"
          done < sources.lock

      - uses: actions/setup-python@v5
        if: steps.plan.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: Install layout-thumbnail renderer
        if: steps.plan.outputs.skip != 'true'
        run: python -m pip install --quiet "gdstk>=0.9.50,<2" "pillow>=10.1,<13"

      - name: Restore thumbnail cache
        if: steps.plan.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/aicdb-hub/thumbs
          key: thumbs-v3-${{ github.run_id }}
          restore-keys: thumbs-v3-

      - name: Build site
        if: steps.plan.outputs.skip != 'true'
        env:
          HUB_FINGERPRINT: ${{ steps.plan.outputs.fingerprint }}
        run: |
          rc=0; python tools/hubkit.py build --root src --out _site || rc=$?
          # 1 = some component failed validation (others still published); anything else is fatal
          [ $rc -eq 0 ] || [ $rc -eq 1 ] || exit $rc
          du -sh _site assets-1/site || true
          {
            echo "### Hub build"
            echo '```'
            cat _site/data/build.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Sync assets-1 shard
        if: steps.plan.outputs.skip != 'true'
        env:
          TOKEN: ${{ secrets.HUB_SOURCES_TOKEN }}
        run: |
          set -euo pipefail
          TOKEN=$(printf %s "$TOKEN" | tr -d '[:space:]')
          git clone --quiet --depth 1 "https://x-access-token:${TOKEN}@github.com/aicdb/hub-gemini4-assets-1.git" /tmp/assets-1 || exit 0
          rsync -a --delete --exclude='.git' --exclude='.github' assets-1/site/ /tmp/assets-1/site/
          git -C /tmp/assets-1 config user.name "github-actions[bot]"
          git -C /tmp/assets-1 config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C /tmp/assets-1 add -A
          if ! git -C /tmp/assets-1 diff --cached --quiet; then
            git -C /tmp/assets-1 commit -m "Sync shard assets from hub build"
            git -C /tmp/assets-1 push origin main || echo "::notice::assets-1 push skipped (check HUB_SOURCES_TOKEN write permission)"
          fi

      - uses: actions/configure-pages@v5
        if: steps.plan.outputs.skip != 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.plan.outputs.skip != 'true'
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
