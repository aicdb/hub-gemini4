<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AICDB Analog Hub</title>
  <meta name="description" content="Unified catalog of automatically generated, layout-verified analog building blocks: switches, sense amplifiers, level shifters, op-amps, LDOs, ADCs and more.">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta name="theme-color" content="#d9423a">
  <link rel="stylesheet" href="assets/style.css">
  <script>try{var t=localStorage.getItem('hub-theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
  <script defer src="assets/blocks.js"></script>
  <script defer src="assets/app.js"></script>
</head>
<body>
  <header class="top">
    <div class="bar">
      <a class="brand" href="#/"><img src="assets/logo-64.png" alt="" width="30" height="30"><span>AICDB</span> Analog Hub</a>
      <nav class="tabs" id="tabs" aria-label="Component types"></nav>
      <button class="iconbtn" id="theme" title="Toggle light / dark theme" aria-label="Toggle theme">◐</button>
    </div>
    <div class="globals">
      <div class="bar" id="globals" aria-label="Options shared by all tabs">
        <label class="opt"><span class="lbl">Technology</span><select id="g-tech"></select></label>
        <div class="opt"><span class="lbl">Simulation</span><div class="seg" id="g-stage" role="group"></div>
          <label class="check" title="When a design has no result at the selected stage, show its nearest earlier stage (marked)"><input type="checkbox" id="g-fb"> fill from earlier stage</label>
        </div>
        <div class="opt"><span class="lbl">V<sub>DD</sub></span><div class="seg" id="g-vdd" role="group"></div><select id="g-vdd2" class="other" title="Less common supplies (e.g. level-shifter output domains)" hidden></select></div>
        <div class="opt"><span class="lbl">Verified</span><div class="seg" id="g-ver" role="group"></div></div>
        <label class="opt"><input type="search" id="g-q" placeholder="Search designs…" aria-label="Search designs"></label>
      </div>
    </div>
  </header>
  <main id="main"><div class="empty-state">Loading…</div></main>
  <footer>
    <div class="credit">
      <span>Built By Anhang Li (anhangli at umich dot edu)</span>
      <span class="sep">|</span>
      <span>Please contact for commercial or derivative use</span>
      <span class="sep">|</span>
      <a class="cc" href="https://creativecommons.org/licenses/by-nc-nd/4.0/" target="_blank" rel="license noopener"
         title="Creative Commons Attribution-NonCommercial-NoDerivatives 4.0 International (CC BY-NC-ND 4.0)">
        <svg class="cc-badge" viewBox="0 0 118 32" width="118" height="32" role="img" aria-label="CC BY-NC-ND 4.0 license">
          <rect x="0.5" y="0.5" width="117" height="31" rx="4" fill="#abb1aa" stroke="#000"/>
          <rect x="33" y="2" width="83" height="28" rx="2.5" fill="#000"/>
          <!-- CC logo -->
          <circle cx="16.5" cy="16" r="12.5" fill="#fff" stroke="#000" stroke-width="2"/>
          <text x="16.5" y="20.6" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="13" fill="#000" letter-spacing="-0.5">cc</text>
          <!-- BY: person -->
          <circle cx="49" cy="13" r="8" fill="#fff"/>
          <circle cx="49" cy="8.9" r="1.7" fill="#000"/>
          <path d="M46.6 11.3h4.8v4.4h-1.3v3.9h-2.2v-3.9h-1.3z" fill="#000"/>
          <!-- NC: crossed dollar -->
          <circle cx="74" cy="13" r="8" fill="#fff"/>
          <text x="74" y="17" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="11" fill="#000">$</text>
          <line x1="68.4" y1="7.4" x2="79.6" y2="18.6" stroke="#000" stroke-width="1.6"/>
          <!-- ND: equals -->
          <circle cx="99" cy="13" r="8" fill="#fff"/>
          <rect x="95" y="10" width="8" height="2" fill="#000"/><rect x="95" y="14" width="8" height="2" fill="#000"/>
          <text x="74.5" y="28.3" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="6.2" fill="#fff" letter-spacing="0.4">BY · NC · ND</text>
        </svg>
        <span>CC BY-NC-ND</span>
      </a>
    </div>
    <div id="foot" class="buildinfo"></div>
  </footer>
</body>
</html>
